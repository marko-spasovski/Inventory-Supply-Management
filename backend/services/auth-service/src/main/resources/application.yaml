spring:
  application:
    name: auth-service
  profiles:
    active: dev

# /livez: the process is up. /readyz: it can serve traffic (includes the database where there is one).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
