# The whole stack in containers (docker-compose.yml), then the Playwright API tests through the
# mobile gateway. Phase 8 moves this to a kind cluster with the Kubernetes manifests.
name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Full stack + API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the stack (build, wait for every health check)
        run: docker compose up --build --wait --wait-timeout 900

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install test runner
        working-directory: tests/e2e
        run: npm ci --no-audit --no-fund

      - name: API tests
        working-directory: tests/e2e
        env:
          E2E_BASE_URL: http://localhost:8090
        run: npx playwright test --reporter=list

      - name: Container status and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200

      - name: Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
