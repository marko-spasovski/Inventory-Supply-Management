# Shared pipeline for the Spring Boot services and the web gateway (docs/architecture.md, "Pipeline").
# Called by each service's own workflow, which decides when it runs (path filter).
#
# Supply chain: GitHub's own actions pinned to a commit SHA; scanners run as Docker images
# pinned by digest, so a moved tag cannot change what runs.
name: java-service

on:
  workflow_call:
    inputs:
      service:
        description: Image name, for example auth-service
        type: string
        required: true
      path:
        description: Folder with the pom.xml, for example backend/services/auth-service
        type: string
        required: true

permissions:
  contents: read

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.180.0@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  # Inputs reach shell scripts only through these variables, never as ${{ }} inside `run:`.
  SERVICE: ${{ inputs.service }}
  SERVICE_PATH: ${{ inputs.path }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check inputs
        run: |
          [[ "$SERVICE" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "invalid service"; exit 1; }
          [[ "$SERVICE_PATH" =~ ^backend/(services|gateways)/[a-z0-9-]+$ ]] || { echo "invalid path"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.path }}/pom.xml

      - name: Build and test (unit + integration)
        working-directory: ${{ inputs.path }}
        run: ./mvnw -B -ntp verify

      - name: Test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.service }}-surefire
          path: ${{ inputs.path }}/target/surefire-reports
          retention-days: 7

      - name: SAST (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --error \
            --config p/java --config p/dockerfile --config p/secrets --config p/owasp-top-ten \
            "$SERVICE_PATH"

      - name: Build image
        run: docker build -t "$SERVICE:ci" "$SERVICE_PATH"

      # Report HIGH and CRITICAL; fail on a CRITICAL that has a fix (accepted exceptions,
      # each with a reason and an expiry date, are in .trivyignore).
      - name: Image scan (Trivy)
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src:ro" "$TRIVY_IMAGE" "$@"; }
          trivy image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignorefile /src/.trivyignore "$SERVICE:ci"
          trivy image --quiet --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /src/.trivyignore "$SERVICE:ci"

      - name: Dockerfile scan (Trivy)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" \
            config --quiet --severity HIGH,CRITICAL --exit-code 1 "/src/$SERVICE_PATH"
