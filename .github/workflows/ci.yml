# Adapted from the Inventory-Supply-Management repo CI for the Novo monorepo layout.
# Changes from the original:
#   - paths: services/ -> backend/services/, mobile-gateway -> backend/gateways/mobile-gateway,
#     e2e -> tests/e2e, compose.yaml -> deploy/docker/compose.yaml
#   - added the web gateway (backend/gateways/web-gateway), which the original did not build
#   - the Angular web-app job and the eight per-remote micro-frontends jobs pointed at folders
#     that no longer exist (web-app/, micro-frontends/). They are replaced by one job for the
#     frontend npm workspace (web shell + 7 remotes + shared packages + Expo mobile tests),
#     which is how the frontend actually builds now (one lockfile at frontend/).
name: Inventory Microservices CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # ── Java / Spring services and the web gateway ───────────────────────────
  java:
    name: java (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-service,      dir: backend/services/auth-service }
          - { name: company-service,   dir: backend/services/company-service }
          - { name: warehouse-service, dir: backend/services/warehouse-service }
          - { name: inventory-service, dir: backend/services/inventory-service }
          - { name: web-gateway,       dir: backend/gateways/web-gateway }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit + integration tests
        working-directory: ${{ matrix.dir }}
        run: mvn test

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: mvn clean package -DskipTests

      - name: Build Docker image
        working-directory: ${{ matrix.dir }}
        run: docker build -t inventory/${{ matrix.name }}:latest .

  # ── .NET services ────────────────────────────────────────────────────────
  dotnet:
    name: dotnet (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fleet-service,   dir: backend/services/fleet-service,   build_dir: backend/services/fleet-service/fleet-service.Tests,     test_target: '' }
          - { name: product-service, dir: backend/services/product-service, build_dir: backend/services/product-service/product-service.Tests, test_target: '' }
          - { name: order-service,   dir: backend/services/order-service,   build_dir: backend/services/order-service,                         test_target: order-service.Tests/order-service.Tests.csproj }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        working-directory: ${{ matrix.build_dir }}
        run: dotnet restore

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.build_dir }}
        run: dotnet build --no-restore -c Release

      - name: Run unit tests
        working-directory: ${{ matrix.build_dir }}
        run: dotnet test ${{ matrix.test_target }} --no-build -c Release

      - name: Build Docker image
        working-directory: ${{ matrix.dir }}
        run: docker build -t inventory/${{ matrix.name }}:latest .

  # ── Node.js services and the mobile gateway ──────────────────────────────
  node:
    name: node (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: notification-service, dir: backend/services/notification-service }
          - { name: ai-service,           dir: backend/services/ai-service }
          - { name: mobile-gateway,       dir: backend/gateways/mobile-gateway }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Run unit tests
        working-directory: ${{ matrix.dir }}
        run: npm test

      - name: Build ${{ matrix.name }}
        working-directory: ${{ matrix.dir }}
        run: npm run build

      - name: Build Docker image
        working-directory: ${{ matrix.dir }}
        run: docker build -t inventory/${{ matrix.name }}:latest .

  # ── Frontend workspace (web shell, 7 remotes, shared packages, mobile) ───
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install workspace dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests (all workspaces that define them)
        working-directory: frontend
        run: npm test --workspaces --if-present

      - name: Build web shell and remotes
        working-directory: frontend
        run: npm run build --workspaces --if-present

      - name: Build combined web image (same as OpenShift)
        working-directory: frontend
        run: docker build -f web/Dockerfile.openshift -t inventory/web-frontend:latest .

  # ── End-to-end (Playwright) ──────────────────────────────────────────────
  # Manual-only. deploy/docker/compose.yaml bundles only DBs, Kafka, gateways and the
  # frontend; the Java/.NET backend services are not in it, so the gateway returns 504
  # when it tries to proxy to them. Trigger from the Actions tab against an environment
  # where the full backend is up (or extend the compose file with the missing services).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [java, dotnet, node]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install Playwright dependencies
        working-directory: tests/e2e
        run: npm install

      - name: Install browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start backend stack
        run: docker compose -f deploy/docker/compose.yaml up -d
        env:
          DB_USER: administrator
          DB_PASSWORD: ci-test-password

      - name: Wait for mobile-gateway to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8090/health > /dev/null 2>&1; then
              echo "Gateway up after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway never came up — dumping logs"
          docker compose -f deploy/docker/compose.yaml logs
          exit 1

      - name: Run Playwright tests
        working-directory: tests/e2e
        run: npm test
        env:
          E2E_BASE_URL: http://localhost:8090

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose -f deploy/docker/compose.yaml down -v
        env:
          DB_USER: administrator
          DB_PASSWORD: ci-test-password
