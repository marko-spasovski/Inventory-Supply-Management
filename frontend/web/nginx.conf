# Single-host web entry point (Kubernetes ingress and local containers).
#   /                -> shell SPA
#   /mf/<name>/...   -> each micro-frontend's built bundle (federation remotes)
#   /api/...         -> web-gateway (Spring Cloud Gateway), prefix stripped
#   /ws              -> notification-service WebSocket
# Listens on 8080 because nginx-unprivileged runs as a non-root user.

# Only a WebSocket upgrade is ever forwarded, so no other protocol (for example h2c)
# can be tunnelled through /ws. "Connection: upgrade" is sent only when the client asked
# for websocket; without it the fixed "Upgrade: websocket" header has no effect.
map $http_upgrade $ws_connection {
    default       close;
    ~*^websocket$ upgrade;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 20M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Micro-frontend bundles (Module Federation remotes). Served as static files.
    location /mf/ {
        try_files $uri =404;
    }

    # REST API -> web gateway. The trailing slash strips the /api prefix, so the
    # gateway sees /auth, /orders, /warehouses, ... (matching its route predicates).
    # Host is left as the upstream's own name; the client's Host header is not forwarded.
    location /api/ {
        proxy_pass http://web-gateway:8080/;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Notification WebSocket (live updates).
    location = /ws {
        proxy_pass http://notification-service:9091;
        # The h2c rule flags every WebSocket proxy. Its mitigation is applied: only
        # "Upgrade: websocket" is ever sent, and only for clients that asked for it (map above).
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade    websocket;
        proxy_set_header Connection $ws_connection;
        proxy_read_timeout 3600s;
    }

    # Shell SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
