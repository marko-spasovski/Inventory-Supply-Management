# Build + push container images to Docker Hub on every push to main.
# Adapted from the Inventory-Supply-Management repo for the Novo monorepo layout.
#
# Changes from the original:
#   - contexts moved under backend/ (services, gateways/web-gateway, gateways/mobile-gateway)
#   - images are built from the Dockerfile.openshift files, which are what the
#     deploy/openshift manifests are written for (the original built the dev Dockerfiles)
#   - the eight per-remote micro-frontend images (context micro-frontends/*, a folder that
#     no longer exists) are replaced by the single combined `web-frontend` image that
#     deploy/openshift/manifests/50-frontend.yaml actually pulls
#   - ai-service has no Dockerfile.openshift and is not in the OpenShift manifests; it is
#     still built from its regular Dockerfile so the image exists if you deploy it separately
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   your Docker Hub user (also used as the image namespace)
#   DOCKERHUB_TOKEN      access token from https://hub.docker.com/settings/security
#
# Tagging strategy:
#   :latest                   — always overwritten with the newest main build
#   :<short-sha>              — immutable per commit (use this in OpenShift)
#   :<branch>                 — handy for short-lived feature branches
#
# Build-on-PR is intentionally disabled (no `pull_request:` trigger): builds
# are heavy and we don't want to publish PR artifacts.
name: build-images

on:
  push:
    branches: [main]
    # Only re-build when source actually changes — saves a lot of minutes.
    paths:
      - 'backend/services/**'
      - 'backend/gateways/**'
      - 'frontend/web/**'
      - 'frontend/packages/**'
      - 'frontend/package*.json'
      - '.github/workflows/images.yml'
  workflow_dispatch:   # let you trigger manually from the Actions tab

# Cancel in-flight runs for the same ref — newer commit wins.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false   # one bad image shouldn't block the others
      matrix:
        include:
          # ── Backend microservices ────────────────────────────────────────
          - { name: auth-service,         context: backend/services/auth-service,         file: Dockerfile.openshift }
          - { name: company-service,      context: backend/services/company-service,      file: Dockerfile.openshift }
          - { name: fleet-service,        context: backend/services/fleet-service,        file: Dockerfile.openshift }
          - { name: warehouse-service,    context: backend/services/warehouse-service,    file: Dockerfile.openshift }
          - { name: product-service,      context: backend/services/product-service,      file: Dockerfile.openshift }
          - { name: inventory-service,    context: backend/services/inventory-service,    file: Dockerfile.openshift }
          - { name: order-service,        context: backend/services/order-service,        file: Dockerfile.openshift }
          - { name: notification-service, context: backend/services/notification-service, file: Dockerfile.openshift }
          - { name: ai-service,           context: backend/services/ai-service,           file: Dockerfile }
          # ── Gateways ─────────────────────────────────────────────────────
          - { name: mobile-gateway,       context: backend/gateways/mobile-gateway,       file: Dockerfile.openshift }
          - { name: web-gateway,          context: backend/gateways/web-gateway,          file: Dockerfile.openshift }
          # ── Web frontend (shell + 7 remotes behind one nginx) ────────────
          - { name: web-frontend,         context: frontend,                              file: web/Dockerfile.openshift }

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute short SHA
        id: sha
        run: echo "sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Sanitize branch name (used as tag)
        id: branch
        run: echo "tag=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build + push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          platforms: linux/amd64
          push: true
          # Caching shaves a lot off rebuild time when only one service changed.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.name }}
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ steps.sha.outputs.sha }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}:${{ steps.branch.outputs.tag }}

  # Optional summary so the Actions UI shows what's deployable.
  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Print image manifest
        run: |
          {
            echo "## Pushed images"
            echo ""
            echo "Tag: \`latest\`, \`${GITHUB_SHA::7}\`, \`${GITHUB_REF_NAME//\//-}\`"
            echo ""
            echo "| Component | Image |"
            echo "|---|---|"
            for n in auth-service company-service fleet-service warehouse-service product-service inventory-service order-service notification-service ai-service mobile-gateway web-gateway web-frontend; do
              echo "| $n | \`docker.io/${{ secrets.DOCKERHUB_USERNAME }}/$n:${GITHUB_SHA::7}\` |"
            done
          } >> $GITHUB_STEP_SUMMARY
