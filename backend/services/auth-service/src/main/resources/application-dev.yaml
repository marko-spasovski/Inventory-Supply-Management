server:
  port: 8081
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/users
    username: administrator
    password: administrator123
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true
# No secret in source code (R03): JWT_SECRET must be set (the launcher and docker-compose.yml set it).
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

auth:
  bootstrap-admin:
    email: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  cookie:
    secure: false        # false for localhost (no HTTPS)
    same-site: Lax       # Lax works fine with proxy
